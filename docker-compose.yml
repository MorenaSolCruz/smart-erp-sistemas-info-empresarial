services:
  mongodb:
    # Base de datos documental donde MongoEngine guarda productos, proveedores,
    # pedidos, desechos y auditoria. El volumen conserva datos entre reinicios.
    image: mongo:7
    container_name: erp-llm-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    # API Django REST. Antes de arrancar espera a MongoDB y carga datos demo,
    # asi el profesor puede ejecutar el proyecto y ver contenido sin crear todo a mano.
    build:
      context: ./backend
    container_name: erp-llm-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py wait_for_mongo &&
             python manage.py seed_demo_data &&
             python manage.py runserver 0.0.0.0:8000"

  frontend:
    # Interfaz React/Vite. Llama al backend por VITE_API_BASE_URL y muestra el
    # ERP como chat + panel lateral de datos.
    build:
      context: ./frontend
    container_name: erp-llm-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api
      VITE_DEFAULT_LLM_PROVIDER: gemini-2.5-flash
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0 --port 5173

volumes:
  # Persistencia local de MongoDB para no perder datos al parar los contenedores.
  mongodb_data:

